<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Form - Batam Eco Portal</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/css/global.css">
    <link rel="stylesheet" href="/css/auth.css">
</head>
<body>

    <div class="auth-wrapper register-page-bg">
        <div class="auth-container login-clean-box">
            
            <div class="login-logo-header">
                <div class="brand-icon-box">
                    <i class="fa-solid fa-leaf"></i>
                </div>
                <h2>Batam Eco Portal</h2>
                <div class="secure-badge-row">
                    <span class="secure-login-tag"><i class="fa-solid fa-lock"></i> SECURE LOGIN</span>
                </div>
            </div>

            <form action="../dashboard.html" method="GET">
                <div class="form-group">
                    <label>EMAIL ADDRESS</label>
                    <div class="input-with-icon">
                        <i class="fa-regular fa-envelope field-icon"></i>
                        <input type="email" placeholder="name@company.com" >
                    </div>
                </div>

                <div class="form-group">
                    <div class="label-row">
                        <label>PASSWORD</label>
                        <a href="#" class="forgot-pass">Forgot password?</a>
                    </div>
                    <div class="input-with-icon">
                        <i class="fa-solid fa-lock field-icon"></i>
                        <input type="password" placeholder="••••••••" >
                        <i class="fa-regular fa-eye toggle-password-icon"></i>
                    </div>
                </div>

                <button type="submit" class="btn-auth-submit-full"><a href="../dashboard.html">Sign In</a> <i class="fa-solid fa-arrow-right" style="margin-left: 6px;"></i></button>

                <div class="login-divider">
                    <span>OR CONTINUE WITH</span>
                </div>

                <div class="oauth-container-row">
                    <button type="button" class="btn-google-oauth">
                        <img src="https://fonts.gstatic.com/s/i/productlogos/googleg/v6/web-24dp/logo_googleg_color_24dp.png" alt="Google Logo">
                        Sign in with Google
                    </button>
                </div>
            </form>

            <p class="auth-footer-text">Don't have an account? <a href="register.html">Register here</a></p>
        </div>

        <footer class="register-page-footer">
            <div class="footer-left">
                <h4>Batam Eco Portal</h4>
                <p>© 2024 Urban Emerald Civic Portal. All rights reserved.</p>
            </div>
            <div class="footer-right">
                <a href="#">Privacy Policy</a>
                <a href="#">Terms of Service</a>
                <a href="#">Accessibility</a>
                <a href="#">Contact Us</a>
            </div>
        </footer>
    </div>

</body>
</html>
